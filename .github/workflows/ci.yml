name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.1", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
      - run: gem build pubb.gemspec
      - run: gem install --local pubb-*.gem --no-document
      - run: cd /tmp && ruby -rpubb -e 'abort unless Pubb::Server.new(app_id:"id", app_key:"key", app_secret:"secret").authorize_channel(socket_id:"1.2", channel:"private-room")["auth"].start_with?("key:")'
